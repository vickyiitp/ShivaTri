<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VickyIiitp | Divine Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-display: 'Syne', sans-serif;
        --font-body: 'Outfit', sans-serif;
        --color-gold: #D4AF37;
        --color-saffron: #FF9933;
        --color-charcoal: #1a1a1a;
      }
      
      body {
        font-family: var(--font-body);
        background-color: #FAFAFA; /* Off-white */
        color: var(--color-charcoal);
        overflow-x: hidden;
      }
      
      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-display);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #B45309; }

      /* Intro Attack Animation */
      @keyframes trisula-attack {
        0% { transform: translate(-50%, -50%) scale(20) rotateX(45deg) rotateZ(10deg); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1) rotateX(0) rotateZ(0); opacity: 1; }
      }

      .animate-attack {
        animation: trisula-attack 1.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      /* Layout Transitions */
      .layout-shift {
        transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
      }

      /* Glassmorphism for Light Mode */
      .glass-light {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.2); /* Gold border */
        box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.15);
      }
      
      /* Mandala Background Pattern */
      .bg-mandala {
        background-image: 
          radial-gradient(circle at center, #D4AF37 1px, transparent 1px),
          radial-gradient(circle at center, rgba(212, 175, 55, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      .text-gradient-gold {
        background: linear-gradient(135deg, #B45309 0%, #D4AF37 50%, #B45309 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    </style>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-amber-200 selection:text-amber-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
